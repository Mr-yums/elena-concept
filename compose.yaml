services:
  demo:
    build: .
    image: elena-concept:1.1.0
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8088}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    pids_limit: 32
